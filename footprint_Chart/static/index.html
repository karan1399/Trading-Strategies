      try {
        const res = await fetch("/api/multi-asset-portfolio");
        if (res.ok) state.multiPortfolioData = await res.json();
      } catch {}
    }

    async function loadPortfolioBacktest() {
      const sym = document.getElementById("sym-select")?.value || "BTCUSDT";
      const costTotal = parseFloat(document.getElementById("cost-select")?.value ?? "12");
      const feeBps = costTotal >= 2 ? (costTotal - 2) : costTotal;
      const slipBps = costTotal >= 2 ? 2.0 : 0.0;
      const profile = state.portfolioProfile || "optimal_8s";
      const pMode = state.portfolioVariant || "125p_mc3";
      const riskPct = pMode === "15p_mc3" ? 1.5 : (pMode === "125p_mc3" ? 1.25 : 1.0);
      const maxConc = 3;
      try {
        const res = await fetch("/api/portfolio-backtest", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            symbol: sym, start_equity: 5000.0, risk_pct: riskPct, max_concurrent: maxConc,
            fee_bps: feeBps, slippage_bps: slipBps, funding_bps_8h: 1.0, mc_runs: 20000,
            profile, entry_delay_mins: 1, realistic_costs: true, use_real_funding: true, max_same_side: 2
          }),
        });
        if (res.ok) state.portfolioData = await res.json();
      } catch {}
    }

    async function refreshMeta() {
      const res = await fetch("/api/meta");
      state.meta = await res.json();
      const bf = state.meta.backfill || {};
      document.getElementById("backfill-pill").textContent = `1Y Backfill: ${bf.days_done || 0}/${bf.days_target || 365}d${bf.running ? " (active)" : ""}`;
      const symSel = document.getElementById("sym-select");
      if (symSel && state.meta.datasets && state.meta.datasets.length) {
        const cur = symSel.value || "BTCUSDT";
        const nextOpts = state.meta.datasets.map(s => `<option value="${s}">${s}</option>`).join("");
        if (symSel.innerHTML !== nextOpts) {
          symSel.innerHTML = nextOpts;
          if (state.meta.datasets.includes(cur)) symSel.value = cur;
        }
      }
    }

    async function boot() {
      await refreshMeta();
      setInterval(refreshMeta, 15000);
      const symSel = document.getElementById("sym-select");
      symSel.innerHTML = (state.meta.datasets || ["BTCUSDT"]).map(s => `<option value="${s}">${s}</option>`).join("");
      const stratSel = document.getElementById("strat-select");
      stratSel.innerHTML = `<option value="none">No Strategy</option>` + state.meta.strategies.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
      const prefStrat = state.meta.strategies.find(s => s.id === "of_initiative_breakout")
        || state.meta.strategies.find(s => s.id === "cg_signals_strategy")
        || state.meta.strategies[0];
      if (prefStrat) stratSel.value = prefStrat.id;

      document.querySelectorAll("#tf-grp button").forEach(b => b.addEventListener("click", () => {
        document.querySelectorAll("#tf-grp button").forEach(x => x.classList.remove("active"));
        b.classList.add("active"); state.tf = b.dataset.tf; loadFootprint(false);
      }));
      document.querySelectorAll("#mode-grp button").forEach(b => b.addEventListener("click", () => {
        document.querySelectorAll("#mode-grp button").forEach(x => x.classList.remove("active"));
        b.classList.add("active"); state.mode = b.dataset.mode; drawCanvas();
      }));
      document.querySelectorAll("#unit-grp button").forEach(b => b.addEventListener("click", () => {
        document.querySelectorAll("#unit-grp button").forEach(x => x.classList.remove("active"));
        b.classList.add("active"); state.unit = b.dataset.unit; loadFootprint(false);
      }));
      document.querySelectorAll(".side-tabs button").forEach(b => b.addEventListener("click", () => {
        document.querySelectorAll(".side-tabs button").forEach(x => x.classList.remove("active"));
        b.classList.add("active"); state.activeTab = b.dataset.tab; renderSide();
      }));

      ["sym-select", "source-select", "bar-type-select", "row-select", "imb-select", "strat-select", "limit-select", "cost-select", "risk-input"].forEach(id =>
        document.getElementById(id).addEventListener("change", () => {
          if (id === "sym-select") { state.livePrice = null; state.wsBar = null; connectBinanceWS(symSel.value || "BTCUSDT"); }
          if (id === "source-select") state.source = document.getElementById("source-select").value;
          if (id === "bar-type-select") state.barType = document.getElementById("bar-type-select").value;
          loadFootprint(false);
        })
      );
      ["chk-zeros", "chk-vpvr", "chk-vwap", "chk-ema89", "chk-ema233", "chk-signals"].forEach(id => document.getElementById(id).addEventListener("change", drawCanvas));

      document.getElementById("auto-y-btn").addEventListener("click", () => {
        state.view.autoY = !state.view.autoY;
        if (state.view.autoY) fitViewY();
        syncAutoYBtn(); drawCanvas();
      });

      document.getElementById("reset-view").addEventListener("click", resetView);

      document.getElementById("reload-btn").addEventListener("click", async () => {
        const r = await fetch("/api/strategies/reload", { method: "POST" });
        const d = await r.json();
        stratSel.innerHTML = `<option value="none">No Strategy</option>` + d.strategies.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
        await loadFootprint(false);
      });

      // ── TRADINGVIEW / COINGLASS INTERACTIONS ─────────────────────────────────
      const cv = document.getElementById("fp-canvas");

      function getZone(mx, my, dims) {
        if (mx >= dims.chartW + dims.vpvrW) return "vzoom";
        if (my >= dims.topPad + dims.chartH) return "hzoom";
        return "pan";
      }

      cv.addEventListener("mousedown", e => {
        if (!state.data || !state.data.bars.length) return;
        const rect = cv.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const dims = getCanvasDims();
        const zone = getZone(mx, my, dims);
        const anchorP = state.view.pHi - (clamp(my - dims.topPad, 0, dims.chartH) / Math.max(1, dims.chartH)) * (state.view.pHi - state.view.pLo);
        state.drag = {
          zone, x: e.clientX, y: e.clientY, mx, my,
          start: state.view.start, count: state.view.count,
          pLo: state.view.pLo, pHi: state.view.pHi,
          anchorP,
        };
        cv.style.cursor = zone === "vzoom" ? "ns-resize" : (zone === "hzoom" ? "ew-resize" : "grabbing");
        e.preventDefault();
      });

      window.addEventListener("mouseup", e => {
        const d = state.drag;
        state.drag = null;
        if (d && d.zone === "pan" && Math.abs(e.clientX - d.x) < 5 && Math.abs(e.clientY - d.y) < 5 && state.data?.bars.length) {
          const rect = cv.getBoundingClientRect();
          const mx = e.clientX - rect.left;
          const dims = getCanvasDims();
          const colW = dims.chartW / Math.max(1, state.view.count);
          const clicked = clamp(Math.floor(state.view.start + mx / colW), 0, state.data.bars.length - 1);
          state.selectedBarIdx = clicked;
          updateKPIs(); renderSide(); scheduleDraw();
        }
        cv.style.cursor = "crosshair";
      });

      window.addEventListener("mousemove", e => {
        const rect = cv.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const dims = getCanvasDims();
        const inside = mx >= 0 && mx <= cv.width && my >= 0 && my <= cv.height;
        state.hover = inside ? { x: mx, y: my } : null;

        const d = state.drag;
        if (!d || !state.data || !state.data.bars.length) {
          if (inside) {
            const z = getZone(mx, my, dims);
            cv.style.cursor = z === "vzoom" ? "ns-resize" : (z === "hzoom" ? "ew-resize" : "crosshair");
          }
          scheduleDraw();
          return;
        }

        const bars = state.data.bars;
        const dx = e.clientX - d.x;
        const dy = e.clientY - d.y;
        const rs = state.data.row_size || 20;

        if (d.zone === "vzoom") {
          state.view.autoY = false; syncAutoYBtn();
          const range = Math.max(rs * 2, d.pHi - d.pLo);
          const f = Math.exp(dy * 0.006);
          const newRange = clamp(range * f, rs * 2, range * 40);
          const frac = clamp((d.my - dims.topPad) / Math.max(1, dims.chartH), 0, 1);
          state.view.pHi = d.anchorP + frac * newRange;
          state.view.pLo = state.view.pHi - newRange;
        } else if (d.zone === "hzoom") {
          const end = d.start + d.count;
          const newCount = clamp(Math.round(d.count * Math.exp(-dx * 0.005)), 4, Math.min(240, bars.length));
          state.view.count = newCount;
          state.view.start = clamp(Math.round(end - newCount), 0, Math.max(0, bars.length - newCount));
          if (state.view.autoY) fitViewY();
        } else {
          // 2D free pan: drag right => reveal older left bars; drag down => shift bars down
          const colW = dims.chartW / Math.max(1, d.count);
          const barsShift = Math.round(dx / Math.max(4, colW));
          state.view.start = clamp(d.start - barsShift, 0, Math.max(0, bars.length - state.view.count));
          if (Math.abs(dy) >= 2) { state.view.autoY = false; syncAutoYBtn(); }
          if (!state.view.autoY) {
            const pShift = (dy / Math.max(1, dims.chartH)) * (d.pHi - d.pLo);
            state.view.pLo = d.pLo + pShift;
            state.view.pHi = d.pHi + pShift;
          } else {
            fitViewY();
          }
        }
        updateKPIs();
        scheduleDraw();
      });

      cv.addEventListener("mouseleave", () => {
        state.hover = null;
        if (!state.drag) scheduleDraw();
      });

      cv.addEventListener("dblclick", e => {
        const rect = cv.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const dims = getCanvasDims();
        if (mx >= dims.chartW + dims.vpvrW) {
          state.view.autoY = true;
          fitViewY();
          syncAutoYBtn();
          drawCanvas();
        } else {
          resetView();
        }
      });

      cv.addEventListener("wheel", e => {
        e.preventDefault();
        if (!state.data || !state.data.bars.length) return;
        const bars = state.data.bars;
        const rect = cv.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const dims = getCanvasDims();
        const rs = state.data.row_size || 20;
        const factor = e.deltaY > 0 ? 1.15 : 0.87;

        if (e.ctrlKey || e.metaKey || mx >= dims.chartW + dims.vpvrW) {
          // Vertical zoom (Price Axis or Ctrl+Wheel) anchored at cursor price
          state.view.autoY = false; syncAutoYBtn();
          const range = Math.max(rs * 2, state.view.pHi - state.view.pLo);
          const newRange = clamp(range * factor, rs * 2, range * 40);
          const frac = clamp((my - dims.topPad) / Math.max(1, dims.chartH), 0, 1);
          const hoverP = state.view.pHi - frac * range;
          state.view.pHi = hoverP + frac * newRange;
          state.view.pLo = state.view.pHi - newRange;
        } else if (e.shiftKey || my >= dims.topPad + dims.chartH) {
          // Horizontal pan
          const step = Math.max(1, Math.round(state.view.count * 0.12)) * (e.deltaY > 0 ? 1 : -1);
          state.view.start = clamp(state.view.start + step, 0, Math.max(0, bars.length - state.view.count));
          if (state.view.autoY) fitViewY();
        } else {
          // Horizontal zoom anchored at cursor bar
          const prevCount = state.view.count;
          const newCount = clamp(Math.round(prevCount * factor), 4, Math.min(240, bars.length));
          const fracX = clamp(mx / Math.max(1, dims.chartW), 0, 1);
          const anchor = state.view.start + fracX * prevCount;
          state.view.count = newCount;
          state.view.start = clamp(Math.round(anchor - fracX * newCount), 0, Math.max(0, bars.length - newCount));
          if (state.view.autoY) fitViewY();
        }
        updateKPIs();
        scheduleDraw();
      }, { passive: false });

      window.addEventListener("keydown", e => {
        if (!state.data || !state.data.bars.length) return;
        const tag = document.activeElement.tagName;
        if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
        const bars = state.data.bars;
        const span = Math.max(1, state.view.pHi - state.view.pLo);
        switch (e.key) {
          case "ArrowLeft":
            e.preventDefault();
            state.view.start = clamp(state.view.start - (e.shiftKey ? 8 : 1), 0, Math.max(0, bars.length - state.view.count));
            if (state.view.autoY) fitViewY();
            break;
          case "ArrowRight":
            e.preventDefault();
            state.view.start = clamp(state.view.start + (e.shiftKey ? 8 : 1), 0, Math.max(0, bars.length - state.view.count));
            if (state.view.autoY) fitViewY();
            break;
          case "ArrowUp":
            e.preventDefault();
            state.view.autoY = false; syncAutoYBtn();
            state.view.pLo += span * 0.08; state.view.pHi += span * 0.08;
            break;
          case "ArrowDown":
            e.preventDefault();
            state.view.autoY = false; syncAutoYBtn();
            state.view.pLo -= span * 0.08; state.view.pHi -= span * 0.08;
            break;
          case "=": case "+":
            e.preventDefault();
            state.view.count = clamp(Math.round(state.view.count * 0.85), 4, Math.min(240, bars.length));
            state.view.start = clamp(state.view.start, 0, Math.max(0, bars.length - state.view.count));
            if (state.view.autoY) fitViewY();
            break;
          case "-": case "_":
            e.preventDefault();
            state.view.count = clamp(Math.round(state.view.count * 1.15), 4, Math.min(240, bars.length));
            state.view.start = clamp(state.view.start, 0, Math.max(0, bars.length - state.view.count));
            if (state.view.autoY) fitViewY();
            break;
          case "PageUp":
            e.preventDefault();
            state.view.autoY = false; syncAutoYBtn();
            { const mid = (state.view.pLo + state.view.pHi) / 2; const ns = span * 0.82; state.view.pLo = mid - ns / 2; state.view.pHi = mid + ns / 2; }
            break;
          case "PageDown":
            e.preventDefault();
            state.view.autoY = false; syncAutoYBtn();
            { const mid = (state.view.pLo + state.view.pHi) / 2; const ns = span * 1.22; state.view.pLo = mid - ns / 2; state.view.pHi = mid + ns / 2; }
            break;
          case "Home":
            e.preventDefault();
            resetView();
            return;
          default: return;
        }
        updateKPIs(); scheduleDraw();
      });

      // Touch / Pinch
      let touchState = null;
      cv.addEventListener("touchstart", e => {
        if (!state.data?.bars.length) return;
        e.preventDefault();
        if (e.touches.length === 1) {
          touchState = { mode: "pan", x: e.touches[0].clientX, y: e.touches[0].clientY,
            start: state.view.start, count: state.view.count, pLo: state.view.pLo, pHi: state.view.pHi };
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          touchState = { mode: "pinch", dist: Math.hypot(dx, dy), count: state.view.count,
            pLo: state.view.pLo, pHi: state.view.pHi, end: state.view.start + state.view.count };
        }
      }, { passive: false });

      cv.addEventListener("touchmove", e => {
        if (!touchState || !state.data?.bars.length) return;
        e.preventDefault();
        const bars = state.data.bars;
        const dims = getCanvasDims();
        if (touchState.mode === "pan" && e.touches.length === 1) {
          const dx = e.touches[0].clientX - touchState.x;
          const dy = e.touches[0].clientY - touchState.y;
          const colW = dims.chartW / Math.max(1, touchState.count);
          state.view.start = clamp(touchState.start - Math.round(dx / Math.max(4, colW)), 0, Math.max(0, bars.length - state.view.count));
          state.view.autoY = false; syncAutoYBtn();
          const pShift = (dy / Math.max(1, dims.chartH)) * (touchState.pHi - touchState.pLo);
          state.view.pLo = touchState.pLo + pShift;
          state.view.pHi = touchState.pHi + pShift;
        } else if (touchState.mode === "pinch" && e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.max(10, Math.hypot(dx, dy));
          const ratio = touchState.dist / dist;
          const newCount = clamp(Math.round(touchState.count * ratio), 4, Math.min(240, bars.length));
          state.view.count = newCount;
          state.view.start = clamp(Math.round(touchState.end - newCount), 0, Math.max(0, bars.length - newCount));
          state.view.autoY = false; syncAutoYBtn();
          const mid = (touchState.pLo + touchState.pHi) / 2;
          const newSpan = (touchState.pHi - touchState.pLo) * ratio;
          state.view.pLo = mid - newSpan / 2;
          state.view.pHi = mid + newSpan / 2;
        }
        updateKPIs(); scheduleDraw();
      }, { passive: false });

      cv.addEventListener("touchend", () => { touchState = null; });
      window.addEventListener("resize", () => { if (state.view.autoY) fitViewY(); drawCanvas(); });

      connectBinanceWS(symSel.value || "BTCUSDT");
      setInterval(pollLiveFallback, 1000);
      await loadFootprint(false);
      setInterval(() => {
        if ((state.source === "inhouse" || state.source === "coinglass") && !state.drag) loadFootprint(true);
      }, 6000);
    }

    boot();
  </script>
</body>
